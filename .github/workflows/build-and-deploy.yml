name: Compilar y Desplegar Sitio Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"




          - name: Verificar y Compilar LaTeX
        run: |
          mkdir -p docs/pdfs
          sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended
          
          # Compilar main.tex si existe
          if [ -f "main.tex" ]; then
            pdflatex -interaction=nonstopmode main.tex || true
            cp main.pdf docs/pdfs/main.pdf || true
          fi
          
          # Compilar Guia 1.tex si existe
          if [ -f "Guia 1.tex" ]; then
            pdflatex -interaction=nonstopmode "Guia 1.tex" || true
            cp "Guia 1.pdf" docs/pdfs/guia1.pdf || true
          fi
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Instalar MkDocs Material
        run: pip install mkdocs-material

      - name: Desplegar en GitHub Pages
        run: mkdocs gh-deploy --force
