name: Compilar y Desplegar Sitio Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Crear carpeta para PDFs
        run: mkdir -p docs/pdfs

      - name: Compilar guia1.tex
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: guia1.tex
          args: "-pdf -interaction=nonstopmode"

      - name: Compilar guia3.tex
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: guia3.tex
          args: "-pdf -interaction=nonstopmode"

      - name: Compilar main.tex si existe
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: main.tex
          args: "-pdf -interaction=nonstopmode"

      - name: Mover PDFs compilados
        run: |
          if [ -f "guia1.pdf" ]; then
            cp guia1.pdf docs/pdfs/guia1.pdf
            echo "guia1.pdf copiado con éxito."
          else
            echo "ERROR: guia1.pdf no se generó."
          fi

          if [ -f "guia3.pdf" ]; then
            cp guia3.pdf docs/pdfs/guia3.pdf   # ✅ Corregido
            echo "guia3.pdf copiado con éxito."
          else
            echo "ERROR: guia3.pdf no se generó."
          fi

          if [ -f "main.pdf" ]; then
            cp main.pdf docs/pdfs/main.pdf
            echo "main.pdf copiado con éxito."
          else
            echo "ERROR: main.pdf no se generó."
          fi

          ls -la docs/pdfs

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Instalar MkDocs Material
        run: pip install mkdocs-material

      - name: Desplegar en GitHub Pages
        run: mkdocs gh-deploy --force
